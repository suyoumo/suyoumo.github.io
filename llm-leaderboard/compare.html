---
layout: default
title: 对局对比 · LLMLeadBoard
permalink: /llm-leaderboard/compare/
---
{% assign board = site.data.llm_leaderboard %}

<div class="cp-page">
  <p class="cp-back"><a href="{{ '/llm-leaderboard/' | relative_url }}">← 返回 LLMLeadBoard</a></p>
  <div id="cp-root"></div>
</div>

<script id="cp-data" type="application/json">{{ board | jsonify }}</script>

<style>
.cp-page { max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; }
.cp-back a { color: #b4552d; text-decoration: none; font-size: 0.9rem; }
.cp-back a:hover { text-decoration: underline; }
.cp-card { background: #fff; border: 1px solid rgba(25,25,24,0.08); border-radius: 14px; padding: 18px 22px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(60,42,28,0.05); }
.cp-pick { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: end; }
@media (max-width: 760px) { .cp-pick { grid-template-columns: 1fr; } }
.cp-pick label { display: block; font-size: 0.78rem; color: #6b6b65; margin-bottom: 4px; }
.cp-pick select { width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(25,25,24,0.18); background: #fbfaf8; font-size: 0.9rem; color: #191918; }
.cp-swap { padding: 8px 14px; border-radius: 10px; border: 1px solid rgba(25,25,24,0.18); background: #fff; cursor: pointer; font-size: 0.85rem; color: #3c3428; }
.cp-swap:hover { background: #f3efe9; }
.cp-side { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.cp-side .cp-name { font-size: 1.15rem; font-weight: 800; color: #191918; }
.cp-side .cp-name a { color: inherit; text-decoration: none; }
.cp-side .cp-name a:hover { text-decoration: underline; }
.cp-side .cp-meta { font-size: 0.8rem; color: #6b6b65; }
.cp-sum { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center; margin-top: 14px; }
@media (max-width: 760px) { .cp-sum { grid-template-columns: 1fr; } }
.cp-sum-num { font-size: 2rem; font-weight: 800; }
.cp-a .cp-sum-num { color: #2e7d4f; }
.cp-b .cp-sum-num { color: #b4502d; }
.cp-mid { text-align: center; }
.cp-mid .cp-draw { font-size: 1.2rem; font-weight: 700; color: #6b6b65; }
.cp-bar { height: 10px; border-radius: 999px; overflow: hidden; display: flex; margin-top: 14px; background: #eee; }
.cp-bar .cp-seg-a { background: #2e7d4f; }
.cp-bar .cp-seg-d { background: #c9c4bc; }
.cp-bar .cp-seg-b { background: #b4502d; }
.cp-note { font-size: 0.78rem; color: #8a8a84; margin-top: 10px; }
.cp-toolbar { margin: 4px 0 10px; font-size: 0.82rem; color: #3c3428; }
.cp-sec { margin: 18px 0 8px; font-size: 0.95rem; font-weight: 800; }
.cp-sec-a { color: #2e7d4f; }
.cp-sec-d { color: #6b6b65; }
.cp-sec-b { color: #b4502d; }
.cp-sec small { font-weight: 400; color: #8a8a84; margin-left: 8px; }
.cp-row { display: grid; grid-template-columns: minmax(140px, 240px) 60px 1fr 60px; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px dashed rgba(25,25,24,0.12); font-size: 0.85rem; }
@media (max-width: 760px) { .cp-row { grid-template-columns: minmax(100px, 1fr) 48px 1fr 48px; } }
.cp-bench { color: #191918; }
.cp-val { font-weight: 800; text-align: right; color: #191918; }
.cp-val.cp-hi-a { color: #2e7d4f; }
.cp-val.cp-hi-b { color: #b4502d; }
.cp-track { position: relative; height: 12px; background: rgba(25,25,24,0.05); border-radius: 6px; }
.cp-track::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(25,25,24,0.25); }
.cp-fill { position: absolute; top: 2px; bottom: 2px; border-radius: 4px; }
.cp-fill-a { background: #2e7d4f; right: 50%; }
.cp-fill-b { background: #b4502d; left: 50%; }
</style>

<script src="{{ '/assets/js/llm-ranking-core.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
<script src="{{ '/assets/js/llm-compare-page.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
